# collectionbuilder-sheets
# Jekyll Digital Collection Generator, designed for GitHub Pages
# https://github.com/CollectionBuilder/collectionbuilder-sheets
##########

##########
# URL VARIABLES [optional if using GitHub Pages!]
#
# url is site domain, full URL to the production location of your collection
# on GitHub Pages follows the pattern username.github.io
#url: https://collectionbuilder.github.io 
# baseurl is path to location on the domain if necessary e.g. /digital/hjccc
# on GitHub Pages it is your github repository's name prefixed with a /
#baseurl: /collectionbuilder-gh 
# location of code, the full url to your github repository
source-code: https://github.com/CollectionBuilder/collectionbuilder-sheets

##########
# SITE SETTINGS
#
# title of site appears in banner
title: Speak-Out! Contemporary Art and Literature in Latin America 1975
# tagline, a short phrase that will appear throughout the site in the top banner
tagline: A symposium of the greatest artists and authors of Latin America in the 1970s
# description appears in meta tags and other locations
# this description might appear in search result lists, keep around 160 characters max
description: |
  <div class="shadow-sm p-4 my-4" style="background-color: #F3E5F5; border-left: 6px solid #7B1FA2; border-radius: .25rem;">
    <h3 style="color: #4A148C;">Collection Overview</h3>
    <p style="color: #1A0033;">
      This digital collection documents the 1975 “Speak-Out! Charla! Bate-Papo!” symposium and its accompanying exhibition, “Plural: Artists of Latin America,” at the University of Texas at Austin.
    </p>
    <p style="color: #1A0033;">
      Explore photographs documenting the artists, writers, panel discussions, gallery installations, and reception.
    </p>
  </div>

  <p style="color: #17324D; text-indent: 30px; margin-bottom: 1.5rem;">
	Finally, the theme of Connection uses the exhibition’s reception to explore the interactions between artists, critics, and panel speakers. Kazuya Sakai converses with Donald B. Goodall, Rodolfo Cardona the Chairman and Professor of the Department of Spanish and Portuguese at UT-Austin interacts with guests alongside Aracy Amaral, and attendees of all kinds interact and share the experience of the symposium and exhibition with each other. Even without the context of the spoken word, communication is visible, guests smiling at Mexican artist Helen Escobedo, Donald B. Goodall shaking the hands of attendees. The art itself remains visible in some shots, the direct subject of guest attention and conversation in some shots, the subject matter of the exhibition in perpetual conversation with all involved. Here, the worlds of art, criticism, and wider cultural understanding mix, and while the meetings present may not have the structure of the symposium proper, they bear the potential for Latin American artistic identity alongside the seeming inevitability of outside influence. 

# creator of the digital collection, to appear in meta tags; we typically use our GitHub usernames but feel free to just use your name
author: Matthew Aufiero

##########
# COLLECTION SETTINGS
#
# Set the metadata for your collection 
# This will be the full URL to your CSV file or relative path + filename of CSV in this repository 
# e.g. relative path "/assets/demo-metadata.csv"
# e.g. published google sheet "https://docs.google.com/spreadsheets/d/e/2PACX-1vSn7AA-cbsXT3_nNUGftc1ab-CKXOJHMQCIENeR9NHElbyI9_qA99o0-HNZdG04v-M2_N21bUe_krQQ/pub?output=csv"
# e.g. on GitHub use the raw link "https://raw.githubusercontent.com/CollectionBuilder/collectionbuilder-sample-data/main/psychiana_cbdemo_gh.csv"
metadata-csv: assets/speakoutmetadata.csv

